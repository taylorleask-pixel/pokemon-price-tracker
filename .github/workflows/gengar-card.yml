name: GengarFinder - record a card

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  record:
    if: contains(github.event.issue.labels.*.name, 'gengar-card') && github.event.issue.user.login == github.repository_owner && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record it and save (retries if another request saves at the same time)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python gengar/scripts/record.py
            [ -f gengar/data/_ok ] || exit 0
            git add gengar/data/collection.json gengar/data/places.json
            git commit -qm "GengarFinder: collection update from #${{ github.event.issue.number }}"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't save after 5 tries" > gengar/data/_result.md; rm -f gengar/data/_ok; exit 1
      - name: Reply
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          if [ -f gengar/data/_result.md ]; then gh issue comment "$N" --body-file gengar/data/_result.md
          else gh issue comment "$N" --body "Something went wrong. Open the Actions tab on GitHub to see what happened."; fi
          if [ -f gengar/data/_ok ]; then gh issue close "$N" --reason completed; fi
