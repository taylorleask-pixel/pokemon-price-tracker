name: GengarFinder - singles prices

on:
  schedule:
    - cron: "53 20,2,8 * * *"   # about 6:53am, 12:53pm and 6:53pm Brisbane
  workflow_dispatch: {}
  push:
    paths:
      - "gengar/scripts/singles.py"
      - "gengar/data/stores.json"

permissions:
  contents: write

concurrency:
  group: gengar-singles
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gengar/scripts/singles.py
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add gengar/data/singles.json gengar/data/changes.json
          git diff --cached --quiet && exit 0
          git commit -qm "GengarFinder: singles prices"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*3)); done
