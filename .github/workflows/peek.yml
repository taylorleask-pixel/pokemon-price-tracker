name: Peek (one-off)
on:
  push:
    paths: ["tools/peek_trigger.txt"]
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/peek.py
      - run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add tools/peek_out.json && git commit -m "peek" && git pull --rebase -X theirs && git push
