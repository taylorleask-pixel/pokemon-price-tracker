name: Peek at product pages (one-off)
on:
  push:
    paths: ["tools/peek_urls.txt"]
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/peek.py
      - run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add tools/peek_out.txt && git commit -m "Peek output" && git pull --rebase && git push
