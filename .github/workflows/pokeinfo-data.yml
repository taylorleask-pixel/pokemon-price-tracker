name: PokeInfo - card data

on:
  schedule:
    - cron: "17 16 * * 2"   # Wednesday about 2am Brisbane
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lang: [en, ja, ko, zh-tw, zh-cn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python pokeinfo/scripts/build.py ${{ matrix.lang }}
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add pokeinfo/data/${{ matrix.lang }}
          git diff --cached --quiet && exit 0
          git commit -qm "PokeInfo: card data (${{ matrix.lang }})"
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs && git push -q && break; sleep $((i*5)); done
