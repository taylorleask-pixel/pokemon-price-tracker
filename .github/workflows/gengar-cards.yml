name: GengarFinder card pictures and prices

on:
  schedule:
    - cron: "41 20 * * *"     # 6:41am Brisbane, once a day
  workflow_dispatch: {}
  push:
    paths:
      - "gengar/data/cards_base.json"
      - "gengar/scripts/build_cards.py"

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gengar/scripts/build_cards.py
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add gengar/data/cards.json
          git diff --cached --quiet || git commit -m "GengarFinder: card pictures and prices"
          git pull --rebase -X theirs
          git push
