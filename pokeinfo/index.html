<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeInfo</title>
<meta name="description" content="Taylor's Pokémon master set binder: every set in English, Japanese, Korean and Chinese">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>try{var p=JSON.parse(localStorage.getItem("pi-palette"));if(p&&p!=="cottage")document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#34503F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokeInfo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="home">PokeInfo</a>
  <nav class="langs" id="langs" aria-label="Card language"></nav>
  <button class="chg" id="changesbtn" type="button" aria-pressed="false">Changes</button>
  <button class="sync" id="sync" type="button" aria-label="Sync settings"><i id="syncdot"></i><span id="synctxt">Not synced</span></button>
</header>

<main id="view"><p class="loading">Opening the binder…</p></main>

<dialog id="cardsheet" aria-labelledby="cs-name"></dialog>
<dialog id="syncsheet" aria-labelledby="ss-title"></dialog>
<dialog id="addsheet" aria-labelledby="as-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="foot">
  <div class="palettes" role="group" aria-label="Colours">
    <span>Colours</span>
    <button type="button" data-pal="cottage"><i style="background:linear-gradient(135deg,#34503F 50%,#B4412C 50%)"></i>Cottage</button>
    <button type="button" data-pal="cocoa"><i style="background:linear-gradient(135deg,#5A3A2B 50%,#E7A94A 50%)"></i>Cocoa</button>
    <button type="button" data-pal="dusk"><i style="background:linear-gradient(135deg,#2D3A5C 50%,#F0B65E 50%)"></i>Dusk</button>
  </div>
  Card lists and pictures come from TCGdex and are checked weekly.
  <a href="../">Pack Watch</a> · <a href="../gengar/">GengarFinder</a></footer>
<script src="app.js"></script>
</body>
</html>
