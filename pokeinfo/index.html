<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeInfo</title>
<meta name="description" content="Taylor's Pokémon master set binder: every set in English, Japanese, Korean and Chinese">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#172030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PokeInfo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="home">PokeInfo</a>
  <nav class="langs" id="langs" aria-label="Card language"></nav>
  <button class="sync" id="sync" type="button" aria-label="Sync settings"><i id="syncdot"></i><span id="synctxt">Not synced</span></button>
</header>

<main id="view"><p class="loading">Opening the binder…</p></main>

<dialog id="cardsheet" aria-labelledby="cs-name"></dialog>
<dialog id="syncsheet" aria-labelledby="ss-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="foot">Card lists and pictures come from TCGdex and are checked weekly.
  <a href="../">Pack Watch</a> · <a href="../gengar/">GengarFinder</a></footer>
<script src="app.js"></script>
</body>
</html>
